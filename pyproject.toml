[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "braingraph"
dynamic = ["version"]
description = "Local-first code intelligence: scan repositories, explore dependency graphs, retrieve focused context, and launch a developer dashboard."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohd.Kaif" }]
maintainers = [{ name = "ClarusCodix" }]
keywords = ["ai", "cli", "codebase", "developer-tools", "graph", "llm", "memory", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities"
]
dependencies = [
  "sqlalchemy>=2.0.30",
  "networkx>=3.3",
  "typer>=0.12.3",
  "rich>=13.7.0",
  "watchdog>=4.0.1",
  "numpy>=1.26.4",
  "tree-sitter>=0.22.3",
  "tree-sitter-language-pack>=0.2.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-dotenv>=1.0.1"
]

[project.urls]
Homepage = "https://github.com/Dislike12/BrainGraph-V2"
Repository = "https://github.com/Dislike12/BrainGraph-V2"
Issues = "https://github.com/Dislike12/BrainGraph-V2/issues"

[project.optional-dependencies]
vector = [
  "chromadb>=0.5.3"
]
dev = [
  "build>=1.2.2",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.16.10,<0.17",
  "mypy>=1.10.0",
  "twine>=5.1.1"
]

[project.scripts]
braingraph = "braingraph.cli.main:run"

[tool.setuptools.packages.find]
include = ["braingraph*"]

[tool.setuptools.package-data]
braingraph = ["webui/*"]

[tool.setuptools.dynamic]
version = { attr = "braingraph.__version__" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "B008",
  "BLE001",
  "E4",
  "E7",
  "E9",
  "F",
  "FURB167",
  "I",
  "PERF101",
  "S110",
  "UP017",
  "UP035",
  "UP037"
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "no:cacheprovider"]
